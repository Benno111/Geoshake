name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Geode mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Android64
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          # Pin the Geometry Dash 2.2081 bindings used with Geode 5.10.1.
          bindings-ref: '7f6c2a75742856de88dad354e576dcff8a28e881'
          # Build the pinned generator instead of downloading the latest one.
          configure-args: '-DSKIP_BUILDING_CODEGEN=OFF'
          # Keep the Android toolchain reproducible.
          android-ndk-version: '27.3.13750724'
