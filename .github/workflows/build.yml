name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Geode mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build all supported platforms
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          # Match the bindings available when Geode 4.0.0 was released.
          bindings-ref: '23c39fcda5dc660d8e92f3fb14f29b0a58a15f98'
          # Build the pinned generator instead of downloading the latest one.
          configure-args: '-DSKIP_BUILDING_CODEGEN=OFF'
          # Geode 4's fmt 11.0.2 fails consteval checks with NDK 29's Clang.
          android-ndk-version: '27.3.13750724'
